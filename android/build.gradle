plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.openwearables'
version = '0.2.0'

android {
  namespace "expo.modules.openwearables"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://www.jitpack.io" }
}

dependencies {
    // Not on Maven Central; JitPack builds the upstream v0.13.3 tag, and its `data`
    // artifact carries the Samsung Health Data SDK.
    implementation("com.github.the-momentum.open_wearables_android_sdk:sdk:v0.13.3")
}